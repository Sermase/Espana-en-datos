# Actualiza los datos y publica la web en GitHub Pages.
# El boletín de MITECO sale los martes; REE se refresca cada día.
name: Datos y despliegue
on:
  schedule:
    - cron: '17 6 * * *'     # cada día: REE y gasolineras
    - cron: '7 17 * * *'     # y por la tarde, que las gasolineras cambian precio a mediodía
    - cron: '43 15 * * 2'    # martes por la tarde, boletín semanal
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Los datos se descargan en las ejecuciones programadas, a mano, o al subir un commit con [datos] en el mensaje.
      - name: Agua (MITECO y REE)
        id: agua
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[agua]')
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Gasolineras (precios de hoy)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[gasolineras]')
        continue-on-error: true
        run: node scripts/gasolineras.mjs
      - name: Población (INE), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[poblacion]')
        continue-on-error: true
        run: node scripts/poblacion.mjs
      - name: Economía (Eurostat), a diario
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[economia]')
        continue-on-error: true
        run: node scripts/economia.mjs
      - name: Energía (REE), a diario
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[energia]')
        continue-on-error: true
        run: node scripts/energia.mjs; node scripts/energia-extra.mjs
      - name: Comercio exterior (Comext), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[comercio]')
        continue-on-error: true
        run: node scripts/comercio.mjs
      - name: Sondas de fuentes futuras
        if: contains(github.event.head_commit.message, '[sonda]')
        continue-on-error: true
        run: node scripts/sonda-comercio.mjs; node scripts/sondas.mjs; node scripts/sonda-ine.mjs
      - name: Enlaces a las fuentes
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[enlaces]')
        continue-on-error: true
        run: node scripts/enlaces.mjs
      - name: Guardar datos nuevos
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[agua]') || contains(github.event.head_commit.message, '[gasolineras]') || contains(github.event.head_commit.message, '[poblacion]') || contains(github.event.head_commit.message, '[economia]') || contains(github.event.head_commit.message, '[energia]') || contains(github.event.head_commit.message, '[comercio]') || contains(github.event.head_commit.message, '[sonda]') || contains(github.event.head_commit.message, '[enlaces]')
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add src/agua/data/snapshot.json src/resumen.json public/agua/data public/gasolineras/data public/poblacion/data public/economia/data public/energia/data public/comercio/data fuentes
          git diff --cached --quiet || git commit -m "Datos del $(date -u +%Y-%m-%d)"
          git push
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
