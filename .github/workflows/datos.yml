# Actualiza los datos y publica la web en GitHub Pages.
# El boletín de MITECO sale los martes; REE se refresca cada día.
name: Datos y despliegue
on:
  schedule:
    - cron: '17 6 * * *'     # cada día: REE y gasolineras
    - cron: '7 17 * * *'     # y por la tarde, que las gasolineras cambian precio a mediodía
    - cron: '43 15 * * 2'    # martes por la tarde, boletín semanal
    - cron: '52 */2 * * *'   # cada dos horas: solo la calidad del aire (no se guarda en el repositorio, va directa a la web)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
# Sin cancelar la que esté en marcha: si coinciden dos, la nueva espera.
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Los datos se descargan en las ejecuciones programadas, a mano, o al subir un commit con [datos] en el mensaje.
      - name: Agua (MITECO y REE)
        id: agua
        if: (github.event_name != 'push' && github.event.schedule != '52 */2 * * *') || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[agua]')
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Gasolineras (precios de hoy)
        if: (github.event_name != 'push' && github.event.schedule != '52 */2 * * *') || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[gasolineras]')
        continue-on-error: true
        run: node scripts/gasolineras.mjs
      - name: Población (INE), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[poblacion]')
        continue-on-error: true
        run: node scripts/poblacion.mjs
      - name: Economía (Eurostat), a diario
        if: (github.event_name != 'push' && github.event.schedule != '52 */2 * * *') || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[economia]')
        continue-on-error: true
        run: node scripts/economia.mjs
      - name: Energía (REE), a diario
        if: (github.event_name != 'push' && github.event.schedule != '52 */2 * * *') || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[energia]')
        continue-on-error: true
        run: node scripts/energia.mjs; node scripts/energia-extra.mjs
      - name: Comercio exterior (Comext), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[comercio]')
        continue-on-error: true
        run: node scripts/comercio.mjs
      - name: Vivienda (INE y Ministerio de Vivienda), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[vivienda]')
        continue-on-error: true
        run: node scripts/vivienda.mjs
      - name: Cuentas públicas (Eurostat), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[cuentas]')
        continue-on-error: true
        run: node scripts/cuentas.mjs
      - name: Saneamiento y depuradoras (INE y MITECO), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[saneamiento]')
        continue-on-error: true
        run: node scripts/saneamiento.mjs; node scripts/depuradoras.mjs
      - name: Impuestos (Agencia Tributaria), los martes
        if: github.event.schedule == '43 15 * * 2' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[impuestos]')
        continue-on-error: true
        run: node scripts/impuestos.mjs
      - name: Seguridad (Interior)
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[seguridad]')
        continue-on-error: true
        run: node scripts/seguridad.mjs
      - name: Aire (Eurostat)
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[aire]')
        continue-on-error: true
        run: node scripts/aire.mjs
      - name: Hogares (INE y Eurostat)
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[hogares]')
        continue-on-error: true
        run: node scripts/hogares.mjs
      - name: Igualdad (INE y Eurostat)
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[igualdad]')
        continue-on-error: true
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/igualdad.mjs
      - name: Coches (DGT y Eurostat)
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[coches]')
        continue-on-error: true
        timeout-minutes: 90
        run: node scripts/coches.mjs
      - name: Sondas de fuentes futuras
        if: contains(github.event.head_commit.message, '[sonda]')
        continue-on-error: true
        run: |
          node scripts/sonda-hoy.mjs
          node scripts/sonda-forma.mjs
      - name: Turismo (INE FRONTUR, EGATUR, ocupación hotelera, viviendas turísticas; Eurostat)
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[turismo]')
        continue-on-error: true
        run: node scripts/turismo.mjs
      - name: Sanidad y salud (Eurostat e INE)
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[sanidad]')
        continue-on-error: true
        run: node scripts/sanidad.mjs
      - name: Enlaces a las fuentes
        if: github.event.schedule == '43 15 * * 2' || contains(github.event.head_commit.message, '[enlaces]')
        continue-on-error: true
        run: node scripts/enlaces.mjs
      - name: Aire casi en directo (Agencia Europea de Medio Ambiente)
        continue-on-error: true
        run: node scripts/aire-ahora.mjs
      - name: España hoy, lo normal de cada día (Open-Meteo, una sola vez)
        if: hashFiles('public/hoy/data/normales.json') == '' || contains(github.event.head_commit.message, '[normales]')
        continue-on-error: true
        timeout-minutes: 40
        run: node scripts/hoy-normales.mjs
      - name: España hoy (IGN, AEMET, Open-Meteo, BOE, BCE y Red Eléctrica)
        continue-on-error: true
        run: node scripts/hoy.mjs
      - name: Guardar datos nuevos
        if: (github.event_name != 'push' && github.event.schedule != '52 */2 * * *') || contains(github.event.head_commit.message, '[datos]') || contains(github.event.head_commit.message, '[agua]') || contains(github.event.head_commit.message, '[gasolineras]') || contains(github.event.head_commit.message, '[poblacion]') || contains(github.event.head_commit.message, '[economia]') || contains(github.event.head_commit.message, '[energia]') || contains(github.event.head_commit.message, '[comercio]') || contains(github.event.head_commit.message, '[vivienda]') || contains(github.event.head_commit.message, '[cuentas]') || contains(github.event.head_commit.message, '[saneamiento]') || contains(github.event.head_commit.message, '[impuestos]') || contains(github.event.head_commit.message, '[seguridad]') || contains(github.event.head_commit.message, '[aire]') || contains(github.event.head_commit.message, '[hogares]') || contains(github.event.head_commit.message, '[coches]') || contains(github.event.head_commit.message, '[igualdad]') || contains(github.event.head_commit.message, '[turismo]') || contains(github.event.head_commit.message, '[sanidad]') || contains(github.event.head_commit.message, '[sonda]') || contains(github.event.head_commit.message, '[enlaces]')
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add src/agua/data/snapshot.json src/agua/data/consumo.json src/resumen.json public/agua/data public/gasolineras/data public/poblacion/data public/economia/data public/energia/data public/comercio/data public/vivienda/data public/cuentas/data public/impuestos/data public/seguridad/data public/aire/data public/hogares/data public/coches/data public/igualdad/data public/turismo/data public/sanidad/data public/hoy/data fuentes
          git diff --cached --quiet || git commit -m "Datos del $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 10; done
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
